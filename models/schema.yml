
  version: 2

sources:
  - name: raw
    database: my-dbt-project-89844
    schema: gz_raw_data
    loader: bigquery
    description: ""
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez - one row per product_id found in each orders_id
        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Unique identifier of the order
          - name: pdt_id
            description: Unique identifier of the product
          - name: revenue
            description: Revenue generated by the sale
          - name: quantity
            description: Quantity of the product sold
        tests:
          - unique:
              column_name: "CONCAT(orders_id, pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: Products of Greenweez - one row per product
        columns:
          - name: products_id
            description: unique identifier of the product
            tests:
              - unique
              - not_null
          - name: purchse_price
            description: Purchase price of the product

      - name: ship
        identifier: raw_gz_ship 
        description: Shipping data of Greenweez - one row per order
        columns:
          - name: orders_id
            description: Unique identifier of the order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: shipping fee charged to customer
          - name: logCost
            description: logistic cost of shipment
          - name: ship_cost
            description: Total shipping cost